<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EJAC">
  <title>EJAC</title>

  <!-- anel externo rosa + disco preto (base do emblema) -->
  <circle cx="32" cy="32" r="31" fill="#C77FA8"/>
  <circle cx="32" cy="32" r="27.5" fill="#0A0A0A"/>

  <!-- chama estilizada, em três camadas de tom -->
